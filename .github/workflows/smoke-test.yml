name: Smoke test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  core-workflow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run core workflow smoke test
        run: bash tests/run_smoke_test.sh
